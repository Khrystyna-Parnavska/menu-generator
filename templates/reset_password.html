{% extends "base.html" %}

{% block head %}
    <title>Reset Password</title>
{% endblock %}

{% block body %}
<h2>Reset Your Password</h2>
<form method="POST">
    <div class="form-box" style="margin-top: 50px; display: block; min-width: 300px; max-width: 400px; margin-left: auto; margin-right: auto;">
        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" required class="input-field" placeholder="Enter new password">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" required class="input-field" placeholder="Confirm new password">
        </div>
        <button type="submit" class="submit-btn">Update Password</button>
    </div>
</form>
{% endblock %}
