{% extends "base.html" %}
{% block body %}

<datalist id="existing-ingredients">
    {% for ing in all_ingredients %}
        <option value="{{ ing.name }}">
    {% endfor %}
</datalist>

<div class="selection-container" style="max-width: 900px; margin: 0 auto; padding: 10px;">
    
    <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; margin-bottom: 30px;">
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end;">
            <div style="flex: 2; min-width: 180px; position: relative;">
                <label class="custom-label">Item Name</label>
                <input type="text" id="manual-name" class="custom-input" list="existing-ingredients" oninput="validateAndMatchCategory(this)">
                
                <small id="manual-warning" style="display:none; color: var(--text-pink); position: absolute; bottom: -18px; left: 0; font-size: 10px; font-weight: bold; white-space: nowrap;">
                    New item! Please select a category.
                </small>
            </div>
            
            <div style="flex: 1.2; min-width: 150px;">
                <label class="custom-label">Category</label>
                <select id="manual-category" class="custom-input">
                    <option value="">-- Pick Category --</option>
                    {% for cat in all_cats_full %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: flex; flex: 1; gap: 5px;">
                <input type="number" step="0.01" id="manual-measure" class="custom-input" placeholder="Qty">
                <input type="text" id="manual-unit" class="custom-input" placeholder="Unit">
            </div>
            
            <button type="button" onclick="addManualItem()" class="submit-btn" style="height: 38px;">Add</button>
        </div>
    </div>

    <form id="shopping-form" method="POST">
        <div id="shopping-list-container">
            {% for category, items in grouped_items.items() %}
            <div class="category-section" id="section-{{ category|replace(' ', '-')|lower }}">
                <h4 style="color: var(--accent-purple); border-bottom: 1px solid rgba(255,255,255,0.1);">{{ category }}</h4>
                <div class="items-container">
                    {% for item in items %}
                    <div class="shopping-row" style="display: flex; align-items: center; padding: 8px 0; {% if item.if_checked %}opacity: 0.4; text-decoration: line-through;{% endif %}">
                        <input type="checkbox" {% if item.if_checked %}checked{% endif %} onclick="toggleCheck(this)">
                        
                        <div style="display: flex; flex: 1; justify-content: space-between; margin-left: 10px;">
                            <span>{{ item.name }}</span>
                            <div>
                                <input type="number" step="0.1" name="item_measures[]" value="{{ item.measure }}" style="width: 50px; background:transparent; border:none; color: var(--text-pink); text-align:right;">
                                <input type="text" name="item_units[]" value="{{ item.units }}" style="width: 40px; background:transparent; border:none; color: #ccc;">
                            </div>
                        </div>

                        <input type="hidden" name="item_names[]" value="{{ item.name }}">
                        <input type="hidden" name="item_category_ids[]" value="{{ item.category_id }}">
                        <input type="hidden" name="item_checked[]" value="{{ 1 if item.if_checked else 0 }}">
                        
                        <button type="button" onclick="this.closest('.shopping-row').remove()">&times;</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="submit-btn" style="margin-top: 20px; width: 100%;">Save Changes</button>
    </form>
</div>

<script>
// Logic fix: Ensure variable name matches Python's 'ing_map'
const ingMap = {{ ing_map | tojson | safe }};

function validateAndMatchCategory(input) {
    const val = input.value.toLowerCase().trim();
    const catSelect = document.getElementById('manual-category');
    const warning = document.getElementById('manual-warning');
    
    if (val === "") {
        warning.style.display = 'none';
        input.style.borderColor = ""; // Reset border
        return;
    }

    if (ingMap[val]) {
        // ITEM EXISTS: Auto-select category and hide warning
        catSelect.value = ingMap[val];
        warning.style.display = 'none';
        input.style.borderColor = ""; // Normal border
    } else {
        // ITEM IS NEW: Show warning and highlight the input
        warning.style.display = 'block';
        input.style.borderColor = "var(--text-pink)"; // Visual cue
    }
}

function addManualItem() {
    const name = document.getElementById('manual-name').value.trim();
    const catSelect = document.getElementById('manual-category');
    const catId = catSelect.value;
    const catName = catSelect.options[catSelect.selectedIndex].text;
    
    if(!name || !catId) { alert("Please enter a name and category"); return; }

    let sectionId = `section-${catName.replace(/\s+/g, '-').toLowerCase()}`;
    let section = document.getElementById(sectionId);

    if (!section) {
        // Create new category section if it doesn't exist
        const container = document.getElementById('shopping-list-container');
        section = document.createElement('div');
        section.id = sectionId;
        section.className = "category-section";
        section.innerHTML = `<h4 style="color: var(--accent-purple); border-bottom: 1px solid rgba(255,255,255,0.1);">${catName}</h4><div class="items-container"></div>`;
        container.prepend(section);
    }

    const itemsContainer = section.querySelector('.items-container');
    const row = document.createElement('div');
    row.className = "shopping-row";
    row.style = "display: flex; align-items: center; padding: 8px 0;";
    row.innerHTML = `
        <input type="checkbox" onclick="toggleCheck(this)">
        <div style="display: flex; flex: 1; justify-content: space-between; margin-left: 10px;">
            <span>${name}</span>
            <div>
                <input type="number" step="0.1" name="item_measures[]" value="${document.getElementById('manual-measure').value || 0}" style="width: 50px; background:transparent; border:none; color: var(--text-pink); text-align:right;">
                <input type="text" name="item_units[]" value="${document.getElementById('manual-unit').value || ''}" style="width: 40px; background:transparent; border:none; color: #ccc;">
            </div>
        </div>
        <input type="hidden" name="item_names[]" value="${name}">
        <input type="hidden" name="item_category_ids[]" value="${catId}">
        <input type="hidden" name="item_checked[]" value="0">
        <button type="button" onclick="this.closest('.shopping-row').remove()">&times;</button>
    `;
    itemsContainer.prepend(row);
}

function toggleCheck(checkbox) {
    const row = checkbox.closest('.shopping-row');
    row.style.opacity = checkbox.checked ? "0.4" : "1";
    row.style.textDecoration = checkbox.checked ? "line-through" : "none";
    row.querySelector('input[name="item_checked[]"]').value = checkbox.checked ? "1" : "0";
}
</script>
{% endblock %}
