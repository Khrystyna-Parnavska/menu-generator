{% extends "base.html" %}
{% block body %}

<datalist id="existing-ingredients">
    {% for ing in all_ingredients %}
        <option value="{{ ing.name }}">
    {% endfor %}
</datalist>

<datalist id="existing-units">
    {% for unit in all_units %}
        <option value="{{ unit.name }}">
    {% endfor %}
</datalist>

<div class="selection-container" style="max-width: 900px; margin: 0 auto; padding: 10px;">
    
    <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 20px; margin-bottom: 30px; box-sizing: border-box;">
        <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
            
            <div style="width: 100%; position: relative;">
                <label class="custom-label">Item Name</label>
                <input type="text" id="manual-name" class="custom-input" list="existing-ingredients" oninput="validateAndMatchCategory(this)" style="width: 100%; box-sizing: border-box;">
                
                <small id="manual-warning" style="display:none; color: var(--text-pink); position: absolute; bottom: -18px; left: 0; font-size: 10px; font-weight: bold; white-space: nowrap;">
                    New item! Please select a category.
                </small>
            </div>
            
            <div style="width: 100%;">
                <label class="custom-label">Category</label>
                <select id="manual-category" class="custom-input" style="width: 100%; box-sizing: border-box;">
                    <option value="">-- Pick Category --</option>
                    {% for cat in all_cats_full %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div style="display: flex; gap: 10px; align-items: flex-end; width: 100%;">
                <div style="flex: 1;">
                    <label class="custom-label">Qty</label>
                    <input type="number" step="0.01" id="manual-measure" class="custom-input" placeholder="Qty" style="width: 100%; box-sizing: border-box;">
                </div>
                <div style="flex: 1;">
                    <label class="custom-label">Unit</label>
                    <input type="text" id="manual-unit" class="custom-input" list="existing-units" placeholder="Unit" style="width: 100%; box-sizing: border-box;">
                </div>
                
                <button type="button" onclick="addManualItem()" class="submit-btn" style="height: 44px; flex: 1; margin: 0; padding: 0 20px;">
                    Add to List
                </button>
            </div>
        </div>
    </div>

    <form id="shopping-form" method="POST">
        <div class="form-group" style="margin-bottom: 30px; max-width: 500px; margin-left: auto; margin-right: auto;">
        <label class="custom-label">Shopping List Name</label>
        <input type="text" name="shop_list_name" class="custom-input" 
               placeholder="e.g., Weekly Groceries, BBQ Party..." 
               value="{{ shop_list_name if shop_list_name else '' }}" required 
               style="text-align: center; font-weight: bold; border: 1px solid var(--accent-purple);">
        </div>
        <div id="shopping-list-container">
            {% for category, items in grouped_items.items() %}
            <div class="category-section" id="section-{{ category|replace(' ', '-')|lower }}" data-category-id="{{ items[0].category_id }}">
                <h4 style="color: var(--accent-purple); border-bottom: 1px solid rgba(255,255,255,0.1);">{{ category }}</h4>
                <div class="items-container">
                    {% for item in items %}
                    <div class="shopping-row" style="display: flex; align-items: center; padding: 8px 0; {% if item.if_checked %}opacity: 0.4; text-decoration: line-through;{% endif %}">
                        <input type="checkbox" {% if item.if_checked %}checked{% endif %} onclick="toggleCheck(this)">
                        <div style="display: flex; flex: 1; justify-content: space-between; margin-left: 10px;">
                            <span style="font-size: 16px; color: white;">{{ item.name }}</span>
                            <div style="display: flex; gap: 8px; align-items: center; min-width: 140px; justify-content: flex-end;">
                                <input type="number" 
                                    step="0.01" 
                                    name="item_measures[]" 
                                    value="{{ item.measure }}"
                                    style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); 
                                            border-radius: 6px; color: var(--text-pink); text-align: center; 
                                            font-size: 16px; font-weight: bold; width: 65px; padding: 8px 2px;
                                            -webkit-appearance: none; -moz-appearance: textfield; margin: 0;">

                                <input type="text" 
                                    name="item_units[]" 
                                    value="{{ item.units }}"
                                    placeholder="unit"
                                    style="background: transparent; border: none; color: white; 
                                            text-align: left; font-size: 16px; font-weight: 500; 
                                            width: 60px; /* Increased width so it's not cut off */
                                            padding: 8px 0; margin-right: 5px;">
                            </div>
                        </div>

                        <input type="hidden" name="item_names[]" value="{{ item.name }}">
                        <input type="hidden" name="item_category_ids[]" value="{{ item.category_id }}">
                        <input type="hidden" name="item_checked[]" value="{{ 1 if item.if_checked else 0 }}">
                        
                        <button type="button" onclick="this.closest('.shopping-row').remove()">&times;</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endfor %}
        </div>
        <button type="submit" class="submit-btn" style="margin-top: 20px; width: 100%;">Save Changes</button>
    </form>
</div>

<script>
// Logic fix: Ensure variable name matches Python's 'ing_map'
const ingMap = {{ ing_map | tojson | safe }};

function validateAndMatchCategory(input) {
    const val = input.value.toLowerCase().trim();
    const catSelect = document.getElementById('manual-category');             
    const warning = document.getElementById('manual-warning');
    
    if (val === "") {
        warning.style.display = 'none';
        input.style.borderColor = ""; // Reset border
        return;
    }

    if (ingMap[val]) {
        // ITEM EXISTS: Auto-select category and hide warning
        catSelect.value = ingMap[val];
        warning.style.display = 'none';
        input.style.borderColor = ""; // Normal border
    } else {
        // ITEM IS NEW: Show warning and highlight the input
        warning.style.display = 'block';
        input.style.borderColor = "var(--text-pink)"; // Visual cue
    }
}

function addManualItem() {
    const name = document.getElementById('manual-name').value;
    const catSelect = document.getElementById('manual-category');
    const catId = catSelect.value;
    const catName = catSelect.options[catSelect.selectedIndex].text; // Get the category name
    const measure = document.getElementById('manual-measure').value || 0;
    const unit = document.getElementById('manual-unit').value || '';

    if (!name || !catId) {
        alert("Please enter a name and select a category.");
        return;
    }

    // 1. Try to find the container
    let section = document.querySelector(`.category-section[data-category-id="${catId}"]`);
    
    // 2. If the section doesn't exist, CREATE IT
    if (!section) {
        const container = document.getElementById('shopping-list-container');
        section = document.createElement('div');
        section.className = 'category-section';
        section.dataset.categoryId = catId;
        section.id = `section-${catName.toLowerCase().replace(/\s+/g, '-')}`;
        
        section.innerHTML = `
            <h4 style="color: var(--accent-purple); border-bottom: 1px solid rgba(255,255,255,0.1); margin-top:20px;">${catName}</h4>
            <div class="items-container"></div>
        `;
        container.appendChild(section);
    }

    const itemsContainer = section.querySelector('.items-container');

    // 3. Create the row
    const row = document.createElement("div");
    row.className = "shopping-row";
    row.style = "display: flex; align-items: center; padding: 8px 0;";
    
    row.innerHTML = `
        <input type="checkbox" onclick="toggleCheck(this)">
        <div style="display: flex; flex: 1; justify-content: space-between; margin-left: 10px; align-items: center;">
            <span style="font-size: 16px; color: white;">${name}</span>
            <div style="display: flex; gap: 8px; align-items: center; min-width: 140px; justify-content: flex-end;">
                <input type="number" step="0.01" name="item_measures[]" value="${measure}" 
                       style="background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: var(--text-pink); text-align: center; font-size: 16px; font-weight: bold; width: 65px; padding: 8px 2px;">
                <input type="text" name="item_units[]" value="${unit}" 
                       style="background: transparent; border: none; color: white; text-align: left; font-size: 16px; font-weight: 500; width: 60px; padding: 8px 0;">
            </div>
        </div>
        <input type="hidden" name="item_names[]" value="${name}">
        <input type="hidden" name="item_category_ids[]" value="${catId}">
        <input type="hidden" name="item_checked[]" value="0">
        <button type="button" onclick="this.closest('.shopping-row').remove()" style="background:none; border:none; color:#ff4d4d; cursor:pointer; margin-left:10px; font-size: 20px;">&times;</button>
    `;

    itemsContainer.prepend(row);
    
    // Clear inputs
    document.getElementById('manual-name').value = '';
    document.getElementById('manual-measure').value = '';
    document.getElementById('manual-unit').value = '';
    document.getElementById('manual-category').value = '';
}

function toggleCheck(checkbox) {
    const row = checkbox.closest('.shopping-row');
    // Find the hidden input responsible for the checked state
    const hiddenInput = row.querySelector('input[name="item_checked[]"]');
    
    if (checkbox.checked) {
        row.style.opacity = "0.4";
        row.style.textDecoration = "line-through";
        hiddenInput.value = "1";
    } else {
        row.style.opacity = "1";
        row.style.textDecoration = "none";
        hiddenInput.value = "0";
    }
}
</script>
{% endblock %}
