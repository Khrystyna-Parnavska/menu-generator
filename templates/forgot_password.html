{% extends "base.html" %}

{% block head %}
    <title>Reset Password</title>
{% endblock %}

{% block body %}
<div class="container">
    <div class="form-box" style="margin-top: 50px; display: block; min-width: 300px; max-width: 400px; margin-left: auto; margin-right: auto;">
        <h2 class="custom-label">Reset Password</h2>
        <p>Enter your email address and we'll send you a link to reset your password.</p>
        
        <form action="{{ url_for('reset_password_request') }}" method="POST">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="user_email" id="email" required class="input-field" placeholder="name@example.com">
            </div>
            <button type="submit" class="submit-btn" style="width:100%">Send Reset Link</button>
        </form>
    </div>
</div>
{% endblock %}
