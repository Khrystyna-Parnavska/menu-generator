{% extends "base.html" %}
{% block head %}<title>Sign In - Menu Generator</title>{% endblock %}
{% block body %}
    <div class="container">
            <div class="form-box" style="margin-top: 50px;">
                <h2 style="text-align: center;">Sign in</h2>
                
                <form action="{{ url_for('signin') }}" method="POST">
                    <input type="hidden" name="user_timezone" id="user_timezone">
                    <label for="email">email address</label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="yourname@example.com" required>
                    
                    <label for="pwd">password</label>
                    <input type="password" id="pwd" name="password" class="input-field" placeholder="••••••••" required>
                    
                    <button type="submit" class="submit-btn" style="width:100%">Submit</button>
                </form>
                <a href="{{ url_for('forgot_password') }}" style="display: block; text-align: center; margin-top: 10px; color: var(--text-pink);">Forgot your password?</a>
                <p style="text-align: center; font-size: 1em; margin-top: 20px;">
                    Don't have an account? 
                    <a href="{{ url_for('signup') }}" style="color:var(--text-pink)">Sign up</a>
                </p>
            </div>
    </div>
    <script>
        document.getElementById('user_timezone').value = Intl.DateTimeFormat().resolvedOptions().timeZone;
    </script>
{% endblock %}
