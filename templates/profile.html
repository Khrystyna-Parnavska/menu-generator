{% extends "base.html" %}

{% block head %}<title>Profile - Menu Generator</title>{% endblock %}

{% block body %}
<div class="container">
    <div class="form-box" style="margin-top: 50px; text-align: center;">
        <h2 style="color:var(--text-pink);">Welcome, {{ current_user.username }}!</h2>
        <p>Add more information for us to know you better</p>
        <form action="/profile" method="POST">
            <div class="profile-form-container">
                <div class="form-group">
                    <label for="new_name">Change Username:</label>
                    <input type="text" id="new_name" name="new_name" class="custom-input" value="{{ user_data.user_name }}" required>
                </div>
                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country_id" name="country_id" class="custom-input">
                        {% for country in countries %}
                            <option value="{{ country.id }}" {% if country.id == user_data.country_id %}selected{% endif %}>{{ country.name }}</option>
                        {% endfor %}    
                    </select>
                </div>

                <div class="form-group inline-group">
                    <label for="birthday">Birthday:</label>
                    <input type="date" id="birthday" name="birthday" class="custom-input date-input" value="{{ user_data.birth_date }}" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" class="custom-input">
                        <option value="non-binary" {% if user_data.gender == "non-binary" %}selected{% endif %}>Non-binary</option>
                        <option value="female" {% if user_data.gender == "female" %}selected{% endif %}>Female</option>
                        <option value="male" {% if user_data.gender == "male" %}selected{% endif %}>Male</option>
                    </select>
                </div>
            </div>
            
            <button type="submit" class="submit-btn" style="width:100%; margin-bottom: 10px;">Save</button>
        </form> <a href="{{ url_for('preferences') }}" style="color:var(--text-pink); font-size: 0.9em;">Go to preferences</a>
        </div>
    </div>
{% endblock %}
